<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
<title id="t">Bord E1 aan de overkant</title>
<desc id="d">Bovenaanzicht: een tweerichtingsstraat. Bord E1 (parkeerverbod) staat op de stoep aan de noordzijde. Aan de zuidzijde, tegenover het bord, staat een groene auto geparkeerd. Er zijn geen andere borden of markeringen.</desc>
