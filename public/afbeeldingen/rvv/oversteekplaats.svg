<title id="t">Auto’s bij een zebrapad</title>
<desc id="d">Bovenaanzicht: een rijbaan met een zebrapad. Auto A staat 3 meter voor het zebrapad stil; een passagier stapt uit, de bestuurder blijft zitten. Auto B staat ongeveer 24 meter voor het zebrapad geparkeerd, zonder iemand erbij.</desc>
