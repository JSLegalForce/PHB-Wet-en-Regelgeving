<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
<title id="t">Gele onderbroken streep</title>
<desc id="d">Bovenaanzicht: langs de stoeprand loopt een gele onderbroken streep. Een groene auto staat langs die streep geparkeerd. Er staan winkels langs de stoep.</desc>
<rect width="640" height="380" fill="#e9efe4"/>
<rect x="0" y="0" width="640" height="36" fill="#1d3557"/><text x="12" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#fff" font-weight="bold">Gele onderbroken streep langs de rand van de rijbaan</text><rect x="0" y="40" width="640" height="80" fill="#d8d2c6"/><rect x="0" y="250" width="640" height="90" fill="#d8d2c6"/><rect x="0" y="120" width="640" height="130" fill="#6e7072"/><line x1="0" y1="120" x2="640" y2="120" stroke="#9a9488" stroke-width="3"/><line x1="0" y1="250" x2="640" y2="250" stroke="#9a9488" stroke-width="3"/><line x1="0" y1="185" x2="640" y2="185" stroke="#fff" stroke-width="3" stroke-dasharray="24 18"/><line x1="0" y1="245" x2="640" y2="245" stroke="#f2c200" stroke-width="6" stroke-dasharray="20 14"/><g><rect x="270" y="196" width="96" height="44" rx="10" fill="#2e8b57" stroke="#1d1d1b" stroke-width="1.5"/><rect x="325.68" y="201" width="19.200000000000003" height="34" rx="4" fill="#bcd3e6"/><rect x="281.52" y="202" width="13.440000000000001" height="32" rx="3" fill="#bcd3e6"/></g><rect x="380" y="332" width="220" height="12" fill="#8c6d5a"/><text x="490.0" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1d1d1b" font-weight="bold">winkels</text><text x="140" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#fff">rijrichting →</text><rect x="0" y="344" width="640" height="36" fill="#ffffff" opacity="0.92"/><text x="12" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#1d1d1b">Een groene auto staat langs de gele onderbroken streep. Lees de casus voor de details.</text>
</svg>
