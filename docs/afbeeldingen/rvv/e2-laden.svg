<title id="t">Bord E2 en een bestelbus die lost</title>
<desc id="d">Bovenaanzicht: een witte bestelbus staat langs de stoeprand naast een paal met bord E2 (verbod stil te staan). Een bezorger draagt direct dozen van de bus naar een winkel.</desc>
<rect width="640" height="380" fill="#e9efe4"/>
