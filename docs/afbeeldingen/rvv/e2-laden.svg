<text x="120" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#fff">rijrichting →</text><rect x="0" y="344" width="640" height="36" fill="#ffffff" opacity="0.92"/><text x="12" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#1d1d1b">De bezorger draagt direct dozen uit de bus de winkel in. Na 4 minuten rijdt hij weg.</text>
