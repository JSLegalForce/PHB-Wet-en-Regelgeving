<title id="t">Gele doorgetrokken streep</title>
<desc id="d">Bovenaanzicht: langs de stoeprand loopt een gele doorgetrokken streep. Een paarse auto staat stil langs die streep met knipperende alarmlichten; een passagier stapt direct in.</desc>
