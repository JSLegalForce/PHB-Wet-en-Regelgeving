<title id="t">Auto voor een uitrit</title>
<desc id="d">Bovenaanzicht: een woning met een uitrit naar een garage; de stoeprand is daar verlaagd. Een donkerblauwe auto staat op de rijbaan precies voor de uitrit.</desc>
<rect width="640" height="380" fill="#e9efe4"/>
