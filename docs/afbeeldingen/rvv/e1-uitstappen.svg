<title id="t">Bord E1 en een uitstappende passagier</title>
<desc id="d">Bovenaanzicht: een blauwe auto staat langs de stoeprand naast een paal met bord E1 (parkeerverbod). De bestuurder blijft zitten, een passagier stapt uit op de stoep en loopt direct weg.</desc>
