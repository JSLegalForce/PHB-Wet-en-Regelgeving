<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
<title id="t">Auto op een fietsstrook</title>
<desc id="d">Bovenaanzicht: langs de rand van de rijbaan ligt een rode fietsstrook met een witte onderbroken streep en een fietssymbool. Een donkere auto staat stil op de fietsstrook met alarmlichten aan; een passagier stapt direct uit op de stoep.</desc>
<rect width="640" height="380" fill="#e9efe4"/>
